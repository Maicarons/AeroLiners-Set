name: Release GRF

# 自动发版：推送 v* tag 时，编译 bin/AeroLinersSet.grf 并作为 Release 附件上传。
# 用法：
#   1. （可选但推荐）先把 CMakeLists.txt 的 project(VERSION ...) 改成新版本号并提交
#   2. git tag v1.1 && git push origin v1.1
#   3. 本 workflow 自动编 grf + 发 Release，无需手动跑 gcc/nmlc/gh
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install nml (provides nmlc)
        run: pip install nml

      - name: Compute REPO_REVISION and version
        id: meta
        run: |
          # grf 内部版本号 = 自 2000-01-01 起的天数
          REPO_REVISION=$(( ( $(date -u +%s) - $(date -u -d '2000-01-01' +%s) ) / 86400 ))
          # 版本号取自 tag（去掉前缀 v）
          NEWGRF_VERSION="${GITHUB_REF_NAME#v}"
          echo "repo_revision=$REPO_REVISION" >> "$GITHUB_OUTPUT"
          echo "newgrf_version=$NEWGRF_VERSION" >> "$GITHUB_OUTPUT"
          echo "REPO_REVISION=$REPO_REVISION  NEWGRF_VERSION=$NEWGRF_VERSION"

      - name: Preprocess and compile GRF
        run: |
          mkdir -p bin
          gcc -D REPO_REVISION="${{ steps.meta.outputs.repo_revision }}" \
              -D NEWGRF_VERSION="${{ steps.meta.outputs.newgrf_version }}" \
              -C -E -nostdinc -x c-header \
              -o bin/AeroLinersSet.nml WAS.pnml
          nmlc --grf=bin/AeroLinersSet.grf -c bin/AeroLinersSet.nml
          ls -la bin/AeroLinersSet.grf

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bin/AeroLinersSet.grf \
            --repo Maicarons/AeroLiners-Set \
            --title "AeroLiners Set ${GITHUB_REF_NAME} (寰宇飞机)" \
            --generate-notes
